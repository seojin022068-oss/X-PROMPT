<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X PROMPT — Prompt Edition</title>
<meta name="description" content="X PROMPT · Prompt Edition — 디자인과 재료 X 프롬프트, 실내건축사례분석 X 프롬프트">
<meta property="og:title" content="X PROMPT — Prompt Edition">
<meta property="og:description" content="디자인과 재료 X 프롬프트 · 실내건축사례분석 X 프롬프트">
<!-- 책 사이트를 미리 불러 두어 장면 전환 뒤 바로 열리게 -->
<link rel="prefetch" href="https://boo-three-beta.vercel.app/">
<link rel="prefetch" href="https://interior-case-prompt.vercel.app/">
<script type="speculationrules">
{"prerender":[{"urls":["https://boo-three-beta.vercel.app/","https://interior-case-prompt.vercel.app/"],"eagerness":"moderate"}],
 "prefetch":[{"urls":["https://boo-three-beta.vercel.app/","https://interior-case-prompt.vercel.app/"],"eagerness":"immediate"}]}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#fff;color:#111;
    font-family:"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }

  /* 배경 글자 */
  .ui{position:fixed;inset:0;pointer-events:none;z-index:1}
  .ui-front{z-index:10}
  .top{
    position:absolute;left:24px;right:24px;top:18px;
    display:flex;justify-content:space-between;
    font-size:12px;font-weight:500;letter-spacing:.02em;
  }
  .top .vol span{margin-left:8px;color:#bbb}
  .top .vol span.on{color:#111}
  /* 제목+책장은 1440×760 한 장면으로 만들고, 화면 크기에 맞춰 통째로 줄이고 키움 (비율 고정) */
  #app{position:fixed;left:0;top:0;width:1440px;height:760px;transform-origin:0 0;z-index:2}
  .title{
    position:absolute;left:0;right:0;top:22px;text-align:center;pointer-events:none;
    transition:opacity .5s;
  }
  body.entering .title{opacity:0}
  .title .eyebrow{font-size:13px;font-weight:500;letter-spacing:.18em}
  .title h1{
    font-weight:700;letter-spacing:-.035em;line-height:.9;
    font-size:114px;
    white-space:nowrap;
  }
  .title p{margin-top:16px;font-size:15px;color:#888;font-weight:400}

  .bottom{
    position:absolute;left:24px;right:24px;bottom:18px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:#888;
  }
  .btns{display:flex;gap:6px;pointer-events:auto}
  .btns button{
    font:inherit;font-size:12px;font-weight:500;color:#111;
    background:#fff;border:1px solid #111;border-radius:999px;
    padding:6px 14px;cursor:pointer;transition:.2s;
  }
  .btns button:hover{background:#111;color:#fff}
  /* PC: 버튼 2배 */
  @media (min-width:900px) and (pointer:fine){
    .btns{gap:12px}
    .btns button{font-size:24px;padding:12px 28px;border-width:1.5px}
    .bottom{font-size:15px;bottom:22px}
  }

  .floor{position:fixed;left:0;right:0;height:1px;background:#111;z-index:0}

  /* 책 */
  #stage{position:absolute;inset:0}
  .book{
    position:absolute;left:0;top:0;
    perspective:1600px;
    will-change:transform;
    cursor:grab;
  }
  .book.grab{cursor:grabbing}
  .box{
    position:absolute;top:0;
    transform-style:preserve-3d;
  }
  .face{
    position:absolute;top:0;height:100%;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  .face img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .face::after{ /* 회전할 때 음영 */
    content:"";position:absolute;inset:0;background:#000;
    opacity:var(--shade,0);pointer-events:none;
  }
  .spine{background:#373737}
  .spine .txt{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;
    font-size:9.1px;font-weight:400;letter-spacing:.3em;color:rgba(255,255,255,.48);
  }
  .spine .rule{position:absolute;left:22%;right:22%;height:1px;background:rgba(255,255,255,.18)}
  .cover{background:#373737}
  .cover .ctxt{
    position:absolute;inset:0;padding:18px 16px;color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .cover .ctxt small{font-size:9.1px;letter-spacing:.28em;color:rgba(255,255,255,.6)}
  .back{background:#333333}
  .back.pub{background:#ddd}
  .pages{background:repeating-linear-gradient(90deg,#f4f2ee 0 1px,#e3e0da 1px 2px)}

  .tag{
    position:absolute;left:50%;bottom:calc(100% + 10px);
    transform:translateX(-50%);
    font-size:11px;font-weight:500;white-space:nowrap;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .book.show .tag{opacity:1}

  /* ── 마우스를 따라 뒤에서 색이 번지고 바뀜 (포트폴리오 Info와 같은 방식) ── */
  #glow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;filter:blur(28px);transform:scale(1.05)}

  /* ── 책 사이트와 같은 커서: 하얀 동그라미 + 누를 때 퍼지는 고리 ── */
  :root{--ease:cubic-bezier(.65,.05,.36,1)}
  @media (pointer:fine){ html.cc, html.cc *{cursor:none !important} }
  #cur{position:fixed;left:0;top:0;z-index:1000;pointer-events:none;opacity:0;transition:opacity .25s}
  #cur.on{opacity:1}
  #cur .halo,#cur .dot{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
  #cur .halo{width:34px;height:34px;background:rgba(255,255,255,.5);box-shadow:0 0 0 1px rgba(60,60,80,.06);
    transition:width .3s var(--ease),height .3s var(--ease),background .3s}
  #cur .dot{width:12px;height:12px;background:#fff;box-shadow:0 1px 6px rgba(40,40,70,.28);transition:width .2s,height .2s}
  #cur.hover .halo{width:46px;height:46px;background:rgba(255,255,255,.42)}
  #cur.down .dot{width:9px;height:9px}
  #cur.down .halo{width:26px;height:26px}
  .ripple{position:fixed;z-index:999;pointer-events:none;border-radius:50%;border:3px solid rgba(255,255,255,.75);
    width:34px;height:34px;transform:translate(-50%,-50%) scale(1);opacity:1;
    box-shadow:0 0 0 1px rgba(60,60,80,.05);animation:ripple .7s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes ripple{to{transform:translate(-50%,-50%) scale(5);opacity:0;border-width:1.5px}}
  .tdot{position:fixed;z-index:999;pointer-events:none;width:12px;height:12px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 11px rgba(255,255,255,.5),0 1px 6px rgba(40,40,70,.25);transform:translate(-50%,-50%);
    animation:tdot .75s ease forwards}
  @keyframes tdot{0%{opacity:1}60%{opacity:1;box-shadow:0 0 0 0 rgba(255,255,255,0),0 1px 6px rgba(40,40,70,.25)}100%{opacity:0;box-shadow:0 0 0 0 rgba(255,255,255,0),0 1px 6px rgba(40,40,70,0)}}

  /* ── 책 안으로 들어가는 장면 전환 ── */
  #wash{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none;filter:blur(30px);transform:scale(1.25)}
  #fly{position:fixed;left:0;top:0;z-index:25;pointer-events:none;transform-origin:0 0;display:none;
    box-shadow:0 30px 60px -30px rgba(40,40,70,.45)}
  #fly img{display:block;width:100%;height:100%}
  #enterT{position:fixed;left:50%;top:50%;z-index:31;transform:translate(-50%,-50%) translateY(10px);
    font-weight:500;font-size:clamp(22px,3.4vw,46px);letter-spacing:-.01em;color:#fff;white-space:nowrap;opacity:0;pointer-events:none;
    text-shadow:0 2px 24px rgba(50,60,90,.22);transition:opacity .7s ease .95s, transform 1s var(--ease) .95s}
  body.entering #enterT{opacity:1;transform:translate(-50%,-50%)}
  body.entering.leaving #enterT{opacity:0;transform:translate(-50%,-50%) translateY(-8px);transition:opacity .45s ease, transform .6s var(--ease)}
  body.entering .ui, body.entering .floor{opacity:0;transition:opacity .5s}

  @media (max-width:640px){
    .top{left:16px;right:16px;top:14px;font-size:11px}
    .bottom{left:16px;right:16px;bottom:14px;flex-direction:column-reverse;align-items:flex-start;gap:10px}
  }
</style>
</head>
<body>

<div class="ui">
  <div class="top">
    <div>Prompt Edition</div>
    <div class="vol">Vol.<span class="on">1</span><span class="on">2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
</div>
<div class="ui ui-front">
  <div class="bottom">
    <div id="hint">공개된 두 권을 눌러 열람본으로 들어가세요</div>
    <div class="btns">
      <button id="scatter">흐트러뜨리기</button>
      <button id="tidy">다시 세우기</button>
    </div>
  </div>
</div>
<div class="floor" id="floor"></div>
<canvas id="glow"></canvas>
<div id="app">
  <div class="title">
    <h1>X PROMPT</h1>
    <p>책 위에 올리면 돌아가고, 끌면 쓰러집니다</p>
  </div>
  <div id="stage"></div>
</div>
<div id="fly"><img alt=""></div>
<canvas id="wash"></canvas>
<div id="enterT"></div>
<div id="cur" aria-hidden="true"><div class="halo"></div><div class="dot"></div></div>

<script src="js/matter.min.js"></script>
<script>
(() => {
  const { Engine, Bodies, Body, Composite, Mouse, MouseConstraint, Query, Events } = Matter;

  /* ---------- 책 데이터 ---------- */
  // 공개된 책: 실제 책등/표지 이미지 (책등 비율 = PDF 책등 폭/높이)
  const PUBLISHED = {
    material: { T: 340 * 53.86 / 728.5, H: 340, W: 340 * 515.9 / 728.5,
      spine: 'covers/material-spine.jpg', cover: 'covers/material.jpg',
      url: 'https://boo-three-beta.vercel.app/', label: '디자인과 재료 X 프롬프트 →', title: '디자인과 재료 X 프롬프트',
      colors: [[186,190,232],[168,214,226],[240,196,176]], base: [247,246,243] },
    interior: { T: 340 * 59.53 / 728.5, H: 340, W: 340 * 515.9 / 728.5,
      spine: 'covers/interior-spine.jpg', cover: 'covers/interior.jpg',
      url: 'https://interior-case-prompt.vercel.app/', label: '실내건축사례분석 X 프롬프트 →', title: '실내건축사례분석 X 프롬프트',
      colors: [[240,190,212],[182,212,234],[212,214,224]], base: [244,240,243] }
  };

  // 공개 전 검정 책 (고정 시드로 매번 같은 모양)
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const LABELS = ['X PROMPT', '', 'VOL. 03', '', 'X PROMPT', 'VOL. 04', '', 'COMING SOON', 'VOL. 05', '', 'X PROMPT', 'VOL. 06', '', 'VOL. 07'];
  const blacks = Array.from({ length: 22 }, (_, i) => {
    const H = 236 + Math.round(rnd() * 100);
    return { T: 26 + Math.round(rnd() * 32), H, W: H * 0.7, label: LABELS[i % LABELS.length],
      tone: ['#373737', '#3b3b3b', '#343434', '#3e3e3e'][i % 4] };
  });

  /* ---------- 화면 / 물리 세팅 ---------- */
  const stage = document.getElementById('stage');
  const floorEl = document.getElementById('floor');
  // 장면 안의 좌표 (항상 같음) — 화면에는 s배로 줄이거나 키워서 보여 줌
  const DW = 1440, DH = 760, vw = DW, vh = DH, k = 1.15, floorY = 726;
  const appEl = document.getElementById('app');
  let engine, mc, books = [], homes = [], s = 1, ax = 0, ay = 0;

  function layoutScale() {
    const W = innerWidth, H = innerHeight;
    const bigBtns = W >= 900 && matchMedia('(pointer:fine)').matches;
    const topPad = W < 700 ? 36 : 48, botPad = bigBtns ? 104 : (W < 700 || H < 500 ? 56 : 64);
    s = Math.min(W / DW, (H - topPad - botPad) / DH);
    ax = (W - DW * s) / 2;
    ay = topPad + ((H - topPad - botPad) - DH * s) / 2;
    appEl.style.transform = `translate(${ax}px, ${ay}px) scale(${s})`;
    floorEl.style.top = (ay + floorY * s) + 'px';
    if (mc) Mouse.setScale(mc.mouse, { x: 1 / s, y: 1 / s });
  }
  // 화면 좌표 → 장면 좌표
  const toScene = (x, y) => ({ x: (x - ax) / s, y: (y - ay) / s });

  function makeFace(cls, w, x, transform, inner = '') {
    const f = document.createElement('div');
    f.className = 'face ' + cls;
    f.style.width = w + 'px';
    f.style.left = x + 'px';
    f.style.transform = transform;
    f.innerHTML = inner;
    return f;
  }

  function buildBook(d, pub) {
    const T = d.T * k, H = d.H * k, W = d.W * k;
    const el = document.createElement('div');
    el.className = 'book';
    el.style.height = H + 'px';
    const box = document.createElement('div');
    box.className = 'box';
    box.style.width = T + 'px';
    box.style.height = H + 'px';

    const spineInner = pub ? `<img src="${d.spine}" alt="">`
      : `<span class="rule" style="top:7%"></span>${d.label ? `<span class="txt">${d.label}</span>` : ''}<span class="rule" style="bottom:7%"></span>`;
    const coverInner = pub ? `<img src="${d.cover}" alt="">`
      : `<div class="ctxt"><small>X PROMPT</small><small>COMING SOON</small></div>`;

    // 직육면체: 앞=책등, 오른쪽=앞표지, 왼쪽=뒤표지, 뒤=책배
    const spineF = makeFace('spine', T, 0, `translateZ(${W / 2}px)`, spineInner);
    const coverF = makeFace('cover', W, (T - W) / 2, `rotateY(90deg) translateZ(${T / 2}px)`, coverInner);
    const backF  = makeFace('back' + (pub ? ' pub' : ''), W, (T - W) / 2, `rotateY(-90deg) translateZ(${T / 2}px)`);
    const pagesF = makeFace('pages', T, 0, `rotateY(180deg) translateZ(${W / 2}px)`);
    if (!pub) { spineF.style.background = d.tone; coverF.style.background = d.tone; }
    box.append(spineF, coverF, backF, pagesF);
    el.appendChild(box);

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = pub ? d.label : 'Coming soon';
    el.appendChild(tag);

    stage.appendChild(el);
    return { el, box, spineF, coverF, T, H, W, pub: !!pub, data: pub ? d : null, url: d.url, turn: 0, target: 0, cw: T };
  }

  function init() {
    if (engine) { Engine.clear(engine); Mouse.clearSourceEvents && mc && Mouse.clearSourceEvents(mc.mouse); }
    stage.innerHTML = ''; books = []; homes = [];

    engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
    engine.gravity.y = 1.1;

    // 화면 폭에 맞게 검정 책 수 조절, 공개된 책은 가운데쪽
    const gap = 5 * k;
    const usable = vw - 40;
    let list = [];
    const L = blacks.slice(0, 8), M = blacks.slice(8, 11), R = blacks.slice(11);
    list = [...L.map(b => [b]), [PUBLISHED.material, 1], ...M.map(b => [b]), [PUBLISHED.interior, 1], ...R.map(b => [b])];
    const width = () => list.reduce((s, [d]) => s + d.T * k + gap, -gap);
    let side = 0;
    while (width() > usable && list.length > 4) {
      // 양 끝에서 번갈아 덜어냄
      if (side++ % 2 === 0) { if (!list[0][1]) list.shift(); else break; }
      else { if (!list[list.length - 1][1]) list.pop(); else break; }
    }

    let x = (vw - width()) / 2;
    list.forEach(([d, pub]) => {
      const b = buildBook(d, pub);
      const cx = x + b.T / 2, cy = floorY - b.H / 2;
      b.body = Bodies.rectangle(cx, cy, b.T, b.H, {
        friction: 0.6, frictionStatic: 0.9, restitution: 0.05, density: 0.0016,
        chamfer: { radius: 1.5 }
      });
      b.body.book = b;
      homes.push({ x: cx, y: cy });
      books.push(b);
      x += b.T + gap;
    });

    const wallT = 200;
    const statics = [
      Bodies.rectangle(vw / 2, floorY + wallT / 2, vw * 3, wallT, { isStatic: true, friction: 1 }),
      Bodies.rectangle(-wallT / 2, vh / 2, wallT, vh * 3, { isStatic: true }),
      Bodies.rectangle(vw + wallT / 2, vh / 2, wallT, vh * 3, { isStatic: true }),
      Bodies.rectangle(vw / 2, -wallT / 2 - 400, vw * 3, wallT, { isStatic: true })
    ];
    Composite.add(engine.world, [...statics, ...books.map(b => b.body)]);

    const mouse = Mouse.create(stage);
    mouse.pixelRatio = 1;
    Mouse.setScale(mouse, { x: 1 / s, y: 1 / s });
    // 휠 스크롤을 막지 않도록
    mouse.element.removeEventListener('wheel', mouse.mousewheel);
    mouse.element.removeEventListener('mousewheel', mouse.mousewheel);
    mouse.element.removeEventListener('DOMMouseScroll', mouse.mousewheel);
    mc = MouseConstraint.create(engine, { mouse, constraint: { stiffness: 0.18, damping: 0.1 } });
    Composite.add(engine.world, mc);

    Events.on(mc, 'startdrag', e => { e.body.book && e.body.book.el.classList.add('grab'); });
    Events.on(mc, 'enddrag', e => { e.body.book && e.body.book.el.classList.remove('grab'); });

    // 처음엔 위에서 차례로 내려와 꽂힘
    tidy(true);
  }

  /* ---------- 다시 세우기 / 흐트러뜨리기 ---------- */
  let tween = null;
  function tidy(fromSky) {
    const now = performance.now();
    books.forEach((b, i) => {
      b.target = 0;
      b.from = fromSky
        ? { x: homes[i].x, y: -b.H - 50 - Math.random() * 200, a: (Math.random() - .5) * 0.6 }
        : { x: b.body.position.x, y: b.body.position.y, a: b.body.angle };
      // 너무 많이 돈 각도는 가까운 방향으로
      b.from.a = Math.atan2(Math.sin(b.from.a), Math.cos(b.from.a));
      b.delay = fromSky ? i * 35 : Math.abs(i - books.length / 2) * 18;
      b.body.collisionFilter.mask = 0;
    });
    engine.gravity.y = 0;
    tween = { start: now, dur: fromSky ? 900 : 750 };
  }

  function stepTween(now) {
    let done = true;
    books.forEach((b, i) => {
      let t = (now - tween.start - b.delay) / tween.dur;
      if (t < 1) done = false;
      t = Math.max(0, Math.min(1, t));
      const e = 1 - Math.pow(1 - t, 3);
      const h = homes[i];
      Body.setPosition(b.body, { x: b.from.x + (h.x - b.from.x) * e, y: b.from.y + (h.y - b.from.y) * e });
      Body.setAngle(b.body, b.from.a * (1 - e));
      Body.setVelocity(b.body, { x: 0, y: 0 });
      Body.setAngularVelocity(b.body, 0);
    });
    if (done) {
      books.forEach(b => (b.body.collisionFilter.mask = 0xFFFFFFFF));
      engine.gravity.y = 1.1;
      tween = null;
    }
  }

  function scatter() {
    if (tween) return;
    books.forEach(b => (b.target = 0));
    const dir = Math.random() < 0.5 ? 1 : -1;
    const order = dir > 0 ? books : [...books].reverse();
    // 한쪽 끝부터 차례로 기울어지는 도미노
    order.forEach((b, i) => {
      setTimeout(() => {
        if (Math.abs(Math.sin(b.body.angle)) < 0.5) {
          Body.setAngularVelocity(b.body, (0.05 + Math.random() * 0.04) * dir);
          Body.setVelocity(b.body, { x: 1.2 * dir, y: b.body.velocity.y });
        }
      }, i * 70);
    });
    // 몇 권은 튀어 올라 헝클어지게
    books.forEach(b => {
      if (Math.random() < 0.3) {
        setTimeout(() => {
          Body.setVelocity(b.body, { x: (Math.random() - .5) * 10, y: -7 - Math.random() * 9 });
          Body.setAngularVelocity(b.body, (Math.random() - .5) * 0.4);
        }, 500 + Math.random() * 1200);
      }
    });
  }
  document.getElementById('tidy').onclick = () => !tween && tidy(false);
  document.getElementById('scatter').onclick = scatter;

  /* ---------- 돌아가기(책등 → 표지) ---------- */
  // 몸체 폭을 바꿀 때는 각도를 0으로 돌려놓고 가로로만 늘린 뒤 다시 기울임
  function setBodyWidth(b, w) {
    const body = b.body, a = body.angle;
    Body.setAngle(body, 0);
    Body.scale(body, w / b.cw, 1);
    Body.setAngle(body, a);
    b.cw = w;
  }

  let pointerType = 'mouse';
  let hovered = null;
  function bodyAt(cx, cy) {
    const hits = Query.point(books.map(b => b.body), toScene(cx, cy));
    return hits.length ? hits[hits.length - 1].book : null;
  }

  stage.addEventListener('pointermove', e => {
    pointerType = e.pointerType;
    if (pointerType !== 'mouse' || tween || entering) return;
    hovered = bodyAt(e.clientX, e.clientY);
  });
  stage.addEventListener('pointerleave', () => { if (pointerType === 'mouse') hovered = null; });

  // 클릭/탭 판정 (끌기와 구분)
  let down = null;
  stage.addEventListener('pointerdown', e => {
    pointerType = e.pointerType;
    down = { x: e.clientX, y: e.clientY, t: performance.now(), book: bodyAt(e.clientX, e.clientY) };
  });
  stage.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    const b = down.book; down = null;
    if (!b || moved > 6 || entering) return;
    if (b.turn > 0.85 && b.pub) { enter(b); return; }
    if (pointerType !== 'mouse') {
      // 터치: 첫 탭은 돌려서 표지 보기, 다른 책은 원래대로
      books.forEach(o => { if (o !== b) o.target = 0; });
      b.target = b.target ? 0 : 1;
    } else {
      b.target = 1;
    }
  });

  /* ---------- 책 안으로 들어가기 ---------- */
  let entering = false, gen = 0, enterAt = 0;   // gen: 뒤로 가기로 돌아오면 바뀌어서 남은 전환 애니메이션을 멈춤
  const flyEl = document.getElementById('fly'), flyImg = flyEl.querySelector('img');
  const wash = document.getElementById('wash'), wctx = wash.getContext('2d');
  const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function enter(b) {
    if (entering) return;
    entering = true; hovered = null; enterAt = performance.now();
    const myGen = ++gen;
    const d = b.data;
    document.getElementById('enterT').textContent = d.title;

    // 1) 돌아간 표지를 떼어 내 화면 가운데로 끌어당김
    const r = b.coverF.getBoundingClientRect();
    flyImg.src = d.cover;
    Object.assign(flyEl.style, { display: 'block', width: r.width + 'px', height: r.height + 'px' });
    b.el.style.visibility = 'hidden';
    const SW = innerWidth, SH = innerHeight;
    const tH = Math.min(SH * .62, SW * .62 / .708), tW = tH * .708;
    const to = { x: (SW - tW) / 2, y: (SH - tH) / 2 - SH * .02, s: tW / r.width };

    // 나머지 책들은 바람에 밀리듯 흩어짐
    books.forEach(o => {
      if (o === b) return;
      const dx = o.body.position.x - toScene(r.left + r.width / 2, 0).x;
      Body.setVelocity(o.body, { x: Math.sign(dx) * (4 + Math.random() * 6), y: -4 - Math.random() * 8 });
      Body.setAngularVelocity(o.body, Math.sign(dx) * (.08 + Math.random() * .2));
    });

    // 2) 표지 뒤에서 그 책의 색이 번져 화면을 채움 → 책 사이트의 첫 배경색으로 이어짐
    const S = 6, W = Math.ceil(SW / S), H = Math.ceil(SH / S);
    wash.width = W; wash.height = H;
    const cx = (to.x + tW / 2) / S, cy = (to.y + tH / 2) / S, maxR = Math.hypot(W, H);
    let sd = 3; const rr = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    const blobs = Array.from({ length: 9 }, (_, i) => ({
      a: rr() * Math.PI * 2, dist: .15 + rr() * .45, c: d.colors[i % 3], delay: i * .045, size: .55 + rr() * .5 }));

    const t0 = performance.now();
    document.body.classList.add('entering');
    (function step(now) {
      if (myGen !== gen) return;
      const t = (now - t0) / 1000;
      // 표지 이동 (0 → 0.75s)
      const p = easeIO(Math.min(1, t / .75));
      const x = r.left + (to.x - r.left) * p, y = r.top + (to.y - r.top) * p, sc = 1 + (to.s - 1) * p;
      const tilt = Math.sin(p * Math.PI) * 14;
      flyEl.style.transform = `translate(${x}px,${y}px) scale(${sc}) perspective(900px) rotateY(${tilt}deg)`;
      flyEl.style.opacity = t < 1.05 ? 1 : Math.max(0, 1 - (t - 1.05) / .35);

      // 색 번짐 (0.35 → 1.6s) → 책 사이트 첫 화면 배경색으로 가라앉음 (1.6 → 2.25s)
      const w = Math.max(0, (t - .35) / 1.25);
      const settle = easeIO(Math.min(1, Math.max(0, (t - 1.6) / .65)));
      wctx.clearRect(0, 0, W, H);
      const base = d.base;
      wctx.globalAlpha = 1;
      wctx.fillStyle = `rgba(${base},${Math.min(1, Math.max(0, (w - .45) / .4))})`;
      wctx.fillRect(0, 0, W, H);
      wctx.globalAlpha = 1 - settle;
      blobs.forEach(bl => {
        const q = easeIO(Math.min(1, Math.max(0, (w - bl.delay) / .8)));
        if (q <= 0) return;
        const drift = t * .25;   // 다 번진 뒤에도 천천히 흐름
        const bx = cx + Math.cos(bl.a + drift) * bl.dist * W * q, by = cy + Math.sin(bl.a + drift) * bl.dist * H * q;
        const R = maxR * bl.size * q + 4;
        const g = wctx.createRadialGradient(bx, by, 0, bx, by, R);
        g.addColorStop(0, `rgba(${bl.c},.95)`); g.addColorStop(.6, `rgba(${bl.c},.55)`); g.addColorStop(1, `rgba(${bl.c},0)`);
        wctx.fillStyle = g; wctx.beginPath(); wctx.arc(bx, by, R, 0, Math.PI * 2); wctx.fill();
      });
      wctx.globalAlpha = 1;
      if (t > 1.55) document.body.classList.add('leaving');
      // 아래 화면도 같은 바탕색으로 덮어 두어 이동하는 순간 비치지 않게
      if (t > 1.2) document.body.style.background = `rgb(${base})`;

      if (t >= 2.25 && !step.went) { step.went = true; location.href = d.url; }
      if (t < 8) requestAnimationFrame(step);   // 다음 페이지가 뜰 때까지 멈추지 않음
    })(t0);
  }

  // 뒤로 가기로 돌아왔을 때: 전환을 멈추고 처음 화면(책이 위에서 내려와 꽂히는 장면)으로
  function resetAfterBack() {
    gen++;
    entering = false;
    document.body.classList.remove('entering', 'leaving');
    document.body.style.background = '';
    flyEl.style.display = 'none';
    wctx.clearRect(0, 0, wash.width, wash.height);
    wash.width = wash.width;   // 캔버스 완전히 비우기
    layoutScale();
    init();
  }
  addEventListener('pageshow', e => { if (e.persisted || entering) resetAfterBack(); });
  // 일부 앱 내 브라우저는 pageshow 대신 화면이 다시 보일 때만 알려 줌
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && entering && performance.now() - (enterAt || 0) > 4000) resetAfterBack();
  });

  /* ---------- 루프 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(32, now - last); last = now;
    if (tween) stepTween(now);

    // 마우스를 올린 책: 바로 서 있고 거의 멈춰 있을 때 돌아감
    if (pointerType === 'mouse') {
      books.forEach(b => {
        const dragging = mc.body === b.body;
        if (b === hovered) {
          const upright = Math.abs(Math.sin(b.body.angle)) < 0.25;
          if (upright || b.target === 1) b.target = 1;
        } else if (!dragging) {
          b.target = 0;
        }
      });
    }

    books.forEach(b => {
      const speed = b.target > b.turn ? 0.0032 : 0.0042;
      if (b.turn !== b.target) {
        b.turn += Math.sign(b.target - b.turn) * speed * dt;
        b.turn = Math.max(0, Math.min(1, b.turn));
      }
      const th = b.turn * Math.PI / 2;
      const ease = Math.sin(th) ** 2; // 부드럽게
      const ang = Math.asin(Math.sqrt(ease));
      const c = Math.cos(ang), s = Math.sin(ang);
      const w = Math.max(b.T, b.T * c + b.W * s);
      if (Math.abs(w - b.cw) > 0.3) setBodyWidth(b, w);
      b.ang = ang;
    });

    Engine.update(engine, dt);

    books.forEach(b => {
      const p = b.body.position, a = b.body.angle;
      const deg = b.ang * 180 / Math.PI;
      const c = Math.cos(b.ang), s = Math.sin(b.ang);
      const front = b.W / 2 * c + b.T / 2 * s;
      b.el.style.width = b.cw + 'px';
      b.el.style.transform = `translate(${p.x - b.cw / 2}px, ${p.y - b.H / 2}px) rotate(${a}rad)`;
      b.box.style.left = (b.cw - b.T) / 2 + 'px';
      b.box.style.transform = `translateZ(${-front}px) rotateY(${-deg}deg)`;
      b.spineF.style.setProperty('--shade', (s * 0.55).toFixed(3));
      b.coverF.style.setProperty('--shade', (c * 0.45).toFixed(3));
      b.el.classList.toggle('show', b.turn > 0.9 && Math.abs(Math.sin(a)) < 0.3);
      b.el.style.zIndex = b.turn > 0.01 ? 5 : 1;
    });

    requestAnimationFrame(frame);
  }

  /* ---------- 커서 (책 사이트와 동일) ---------- */
  const cur = document.getElementById('cur'), fine = matchMedia('(pointer:fine)').matches;
  if (fine) document.documentElement.classList.add('cc');
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse') return;
    cur.style.transform = `translate(${e.clientX}px,${e.clientY}px)`; cur.classList.add('on');
    const overBtn = e.target.closest && e.target.closest('button, a');
    cur.classList.toggle('hover', !!overBtn || (!!hovered && !entering));
  }, { passive: true });
  document.addEventListener('mouseleave', () => cur.classList.remove('on'));
  const spawn = (cls, x, y) => { const r = document.createElement('div'); r.className = cls; r.style.left = x + 'px'; r.style.top = y + 'px';
    document.body.append(r); r.addEventListener('animationend', () => r.remove()); };
  addEventListener('pointerdown', e => {
    spawn('ripple', e.clientX, e.clientY);
    if (e.pointerType === 'mouse') cur.classList.add('down'); else spawn('tdot', e.clientX, e.clientY);
  }, { passive: true });
  addEventListener('pointerup', () => cur.classList.remove('down'));

  /* ---------- 마우스를 따라 뒤에서 색이 번지고 바뀜 ---------- */
  (function () {
    const cv = document.getElementById('glow'), ctx = cv.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const ACC = [[239,189,214],[223,189,239],[189,206,239],[189,239,235],[189,239,206],[239,223,189]];
    const S = 6; let W, H;
    function size() { W = Math.ceil(innerWidth / S); H = Math.ceil(innerHeight / S); cv.width = W; cv.height = H; }
    size(); addEventListener('resize', size);
    const m = { x: innerWidth * .6, y: innerHeight * .4 }; let travel = 0, last = null;
    addEventListener('pointermove', e => {
      if (last) travel += Math.hypot(e.clientX - last.x, e.clientY - last.y);
      last = { x: e.clientX, y: e.clientY }; m.x = e.clientX; m.y = e.clientY;
    }, { passive: true });
    const blobs = [{ k: .08, d: .82, r: .30 }, { k: .035, d: .88, r: .42 }].map(b => ({ ...b, x: m.x, y: m.y, vx: 0, vy: 0 }));
    const mix = t => { const n = ACC.length, i = ((Math.floor(t) % n) + n) % n, j = (i + 1) % n, f = t - Math.floor(t); return ACC[i].map((v, k) => Math.round(v + (ACC[j][k] - v) * f)); };
    let bookTint = null, tintAmt = 0;
    function frame() {
      ctx.globalCompositeOperation = 'destination-out'; ctx.fillStyle = 'rgba(0,0,0,.025)'; ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
      // 공개된 책 위에 있으면 그 책의 색으로 물듦
      const hb = hovered && hovered.pub ? hovered.data : null;
      if (hb) bookTint = hb;
      tintAmt += ((hb ? 1 : 0) - tintAmt) * .06;
      const hue = (m.x / innerWidth) * 2.5 + travel / 900;
      blobs.forEach((b, i) => {
        b.vx = (b.vx + (m.x - b.x) * b.k) * b.d; b.vy = (b.vy + (m.y - b.y) * b.k) * b.d; b.x += b.vx; b.y += b.vy;
        let c = mix(hue + i * 1.3);
        if (bookTint && tintAmt > .01) {
          const bc = bookTint.colors[(Math.floor(travel / 300) + i) % 3];
          c = c.map((v, k) => Math.round(v + (bc[k] - v) * tintAmt));
        }
        const R = Math.min(innerWidth, innerHeight) * b.r / S;
        const g = ctx.createRadialGradient(b.x / S, b.y / S, 0, b.x / S, b.y / S, R);
        g.addColorStop(0, `rgba(${c.join(',')},.14)`); g.addColorStop(1, `rgba(${c.join(',')},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x / S, b.y / S, R, 0, Math.PI * 2); ctx.fill();
      });
      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  let rt;
  // 회전·창 크기 변경: 장면은 그대로 두고 크기만 다시 맞춤
  addEventListener('resize', () => { layoutScale(); clearTimeout(rt); rt = setTimeout(layoutScale, 300); });
  layoutScale();
  init();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

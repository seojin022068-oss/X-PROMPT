<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X PROMPT — 김주연 프롬프트 시리즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:#fff;color:#111;
    font-family:"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
    touch-action:none;
  }

  /* 배경 글자 */
  .ui{position:fixed;inset:0;pointer-events:none;z-index:1}
  .ui-front{z-index:10}
  .top{
    position:absolute;left:24px;right:24px;top:18px;
    display:flex;justify-content:space-between;
    font-size:12px;font-weight:500;letter-spacing:.02em;
  }
  .top .vol span{margin-left:8px;color:#bbb}
  .top .vol span.on{color:#111}
  .title{
    position:absolute;left:0;right:0;top:9vh;text-align:center;
  }
  .title .eyebrow{font-size:13px;font-weight:500;letter-spacing:.18em}
  .title h1{
    font-weight:700;letter-spacing:-.035em;line-height:.9;
    font-size:min(15vw, 19vh);
    margin-top:1.2vh;white-space:nowrap;
  }
  .title p{margin-top:2vh;font-size:13px;color:#888;font-weight:400}

  .bottom{
    position:absolute;left:24px;right:24px;bottom:18px;
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:#888;
  }
  .btns{display:flex;gap:6px;pointer-events:auto}
  .btns button{
    font:inherit;font-size:12px;font-weight:500;color:#111;
    background:#fff;border:1px solid #111;border-radius:999px;
    padding:6px 14px;cursor:pointer;transition:.2s;
  }
  .btns button:hover{background:#111;color:#fff}

  .floor{position:fixed;left:0;right:0;height:1px;background:#111;z-index:0}

  /* 책 */
  #stage{position:fixed;inset:0;z-index:2}
  .book{
    position:absolute;left:0;top:0;
    perspective:1600px;
    will-change:transform;
    cursor:grab;
  }
  .book.grab{cursor:grabbing}
  .box{
    position:absolute;top:0;
    transform-style:preserve-3d;
  }
  .face{
    position:absolute;top:0;height:100%;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    overflow:hidden;
  }
  .face img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
  .face::after{ /* 회전할 때 음영 */
    content:"";position:absolute;inset:0;background:#000;
    opacity:var(--shade,0);pointer-events:none;
  }
  .spine{background:#111}
  .spine .txt{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;
    font-size:10px;font-weight:500;letter-spacing:.24em;color:rgba(255,255,255,.4);
  }
  .spine .rule{position:absolute;left:22%;right:22%;height:1px;background:rgba(255,255,255,.18)}
  .cover{background:#111}
  .cover .ctxt{
    position:absolute;inset:0;padding:18px 16px;color:#fff;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .cover .ctxt b{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .cover .ctxt small{font-size:10px;letter-spacing:.2em;color:rgba(255,255,255,.5)}
  .back{background:#0b0b0b}
  .back.pub{background:#ddd}
  .pages{background:repeating-linear-gradient(90deg,#f4f2ee 0 1px,#e3e0da 1px 2px)}

  .tag{
    position:absolute;left:50%;bottom:calc(100% + 10px);
    transform:translateX(-50%);
    font-size:11px;font-weight:500;white-space:nowrap;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  .book.show .tag{opacity:1}

  @media (max-width:640px){
    .top{left:16px;right:16px;top:14px;font-size:11px}
    .bottom{left:16px;right:16px;bottom:14px;flex-direction:column-reverse;align-items:flex-start;gap:10px}
    .title{top:9vh}
  }
</style>
</head>
<body>

<div class="ui">
  <div class="top">
    <div>김주연 · Prompt Series</div>
    <div class="vol">Vol.<span class="on">1</span><span class="on">2</span><span>3</span><span>4</span><span>5</span></div>
  </div>
  <div class="title">
    <div class="eyebrow">SERIES 01</div>
    <h1>X PROMPT</h1>
    <p>책 위에 올리면 돌아가고, 끌면 쓰러집니다</p>
  </div>
</div>
<div class="ui ui-front">
  <div class="bottom">
    <div id="hint">공개된 두 권을 눌러 열람본으로 들어가세요</div>
    <div class="btns">
      <button id="scatter">흐트러뜨리기</button>
      <button id="tidy">다시 세우기</button>
    </div>
  </div>
</div>
<div class="floor" id="floor"></div>
<div id="stage"></div>

<script src="js/matter.min.js"></script>
<script>
(() => {
  const { Engine, Bodies, Body, Composite, Mouse, MouseConstraint, Query, Events } = Matter;

  /* ---------- 책 데이터 ---------- */
  // 공개된 책: 실제 책등/표지 이미지 (책등 비율 = PDF 책등 폭/높이)
  const PUBLISHED = {
    material: { T: 340 * 53.86 / 728.5, H: 340, W: 340 * 515.9 / 728.5,
      spine: 'covers/material-spine.jpg', cover: 'covers/material.jpg',
      url: 'https://boo-three-beta.vercel.app', label: '디자인과 재료 X 프롬프트 →' },
    interior: { T: 340 * 59.53 / 728.5, H: 340, W: 340 * 515.9 / 728.5,
      spine: 'covers/interior-spine.jpg', cover: 'covers/interior.jpg',
      url: 'https://interior-case-prompt.vercel.app', label: '실내건축사례분석 X 프롬프트 →' }
  };

  // 공개 전 검정 책 (고정 시드로 매번 같은 모양)
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const LABELS = ['X PROMPT', '', 'VOL. 03', '', 'X PROMPT', 'VOL. 04', '', 'COMING SOON', 'VOL. 05', '', 'X PROMPT', 'VOL. 06', '', 'VOL. 07'];
  const blacks = Array.from({ length: 22 }, (_, i) => {
    const H = 236 + Math.round(rnd() * 100);
    return { T: 26 + Math.round(rnd() * 32), H, W: H * 0.7, label: LABELS[i % LABELS.length],
      tone: ['#111', '#161616', '#0c0c0c', '#1b1b1b'][i % 4] };
  });

  /* ---------- 화면 / 물리 세팅 ---------- */
  const stage = document.getElementById('stage');
  const floorEl = document.getElementById('floor');
  let engine, mc, books = [], vw, vh, k, floorY, homes = [];

  function layoutScale() {
    vw = innerWidth; vh = innerHeight;
    k = Math.max(0.55, Math.min(1, vw / 1150, (vh - 120) / 640));
    floorY = vh - (vw < 640 ? 96 : 64);
  }

  function makeFace(cls, w, x, transform, inner = '') {
    const f = document.createElement('div');
    f.className = 'face ' + cls;
    f.style.width = w + 'px';
    f.style.left = x + 'px';
    f.style.transform = transform;
    f.innerHTML = inner;
    return f;
  }

  function buildBook(d, pub) {
    const T = d.T * k, H = d.H * k, W = d.W * k;
    const el = document.createElement('div');
    el.className = 'book';
    el.style.height = H + 'px';
    const box = document.createElement('div');
    box.className = 'box';
    box.style.width = T + 'px';
    box.style.height = H + 'px';

    const spineInner = pub ? `<img src="${d.spine}" alt="">`
      : `<span class="rule" style="top:7%"></span>${d.label ? `<span class="txt" style="font-size:${Math.max(8, 10 * k)}px">${d.label}</span>` : ''}<span class="rule" style="bottom:7%"></span>`;
    const coverInner = pub ? `<img src="${d.cover}" alt="">`
      : `<div class="ctxt"><small>VOL. —</small><b style="font-size:${22 * k}px">X<br>PROMPT</b><small>COMING SOON</small></div>`;

    // 직육면체: 앞=책등, 오른쪽=앞표지, 왼쪽=뒤표지, 뒤=책배
    const spineF = makeFace('spine', T, 0, `translateZ(${W / 2}px)`, spineInner);
    const coverF = makeFace('cover', W, (T - W) / 2, `rotateY(90deg) translateZ(${T / 2}px)`, coverInner);
    const backF  = makeFace('back' + (pub ? ' pub' : ''), W, (T - W) / 2, `rotateY(-90deg) translateZ(${T / 2}px)`);
    const pagesF = makeFace('pages', T, 0, `rotateY(180deg) translateZ(${W / 2}px)`);
    if (!pub) { spineF.style.background = d.tone; coverF.style.background = d.tone; }
    box.append(spineF, coverF, backF, pagesF);
    el.appendChild(box);

    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = pub ? d.label : 'Coming soon';
    el.appendChild(tag);

    stage.appendChild(el);
    return { el, box, spineF, coverF, T, H, W, pub: !!pub, url: d.url, turn: 0, target: 0, cw: T };
  }

  function init() {
    if (engine) { Engine.clear(engine); Mouse.clearSourceEvents && mc && Mouse.clearSourceEvents(mc.mouse); }
    stage.innerHTML = ''; books = []; homes = [];
    layoutScale();
    floorEl.style.top = floorY + 'px';

    engine = Engine.create({ positionIterations: 10, velocityIterations: 8 });
    engine.gravity.y = 1.1;

    // 화면 폭에 맞게 검정 책 수 조절, 공개된 책은 가운데쪽
    const gap = 5 * k;
    const usable = vw - 40;
    let list = [];
    const L = blacks.slice(0, 8), M = blacks.slice(8, 11), R = blacks.slice(11);
    list = [...L.map(b => [b]), [PUBLISHED.material, 1], ...M.map(b => [b]), [PUBLISHED.interior, 1], ...R.map(b => [b])];
    const width = () => list.reduce((s, [d]) => s + d.T * k + gap, -gap);
    let side = 0;
    while (width() > usable && list.length > 4) {
      // 양 끝에서 번갈아 덜어냄
      if (side++ % 2 === 0) { if (!list[0][1]) list.shift(); else break; }
      else { if (!list[list.length - 1][1]) list.pop(); else break; }
    }

    let x = (vw - width()) / 2;
    list.forEach(([d, pub]) => {
      const b = buildBook(d, pub);
      const cx = x + b.T / 2, cy = floorY - b.H / 2;
      b.body = Bodies.rectangle(cx, cy, b.T, b.H, {
        friction: 0.6, frictionStatic: 0.9, restitution: 0.05, density: 0.0016,
        chamfer: { radius: 1.5 }
      });
      b.body.book = b;
      homes.push({ x: cx, y: cy });
      books.push(b);
      x += b.T + gap;
    });

    const wallT = 200;
    const statics = [
      Bodies.rectangle(vw / 2, floorY + wallT / 2, vw * 3, wallT, { isStatic: true, friction: 1 }),
      Bodies.rectangle(-wallT / 2, vh / 2, wallT, vh * 3, { isStatic: true }),
      Bodies.rectangle(vw + wallT / 2, vh / 2, wallT, vh * 3, { isStatic: true }),
      Bodies.rectangle(vw / 2, -wallT / 2 - 400, vw * 3, wallT, { isStatic: true })
    ];
    Composite.add(engine.world, [...statics, ...books.map(b => b.body)]);

    const mouse = Mouse.create(stage);
    mouse.pixelRatio = 1;
    // 휠 스크롤을 막지 않도록
    mouse.element.removeEventListener('wheel', mouse.mousewheel);
    mouse.element.removeEventListener('mousewheel', mouse.mousewheel);
    mouse.element.removeEventListener('DOMMouseScroll', mouse.mousewheel);
    mc = MouseConstraint.create(engine, { mouse, constraint: { stiffness: 0.18, damping: 0.1 } });
    Composite.add(engine.world, mc);

    Events.on(mc, 'startdrag', e => { e.body.book && e.body.book.el.classList.add('grab'); });
    Events.on(mc, 'enddrag', e => { e.body.book && e.body.book.el.classList.remove('grab'); });

    // 처음엔 위에서 차례로 내려와 꽂힘
    tidy(true);
  }

  /* ---------- 다시 세우기 / 흐트러뜨리기 ---------- */
  let tween = null;
  function tidy(fromSky) {
    const now = performance.now();
    books.forEach((b, i) => {
      b.target = 0;
      b.from = fromSky
        ? { x: homes[i].x, y: -b.H - 50 - Math.random() * 200, a: (Math.random() - .5) * 0.6 }
        : { x: b.body.position.x, y: b.body.position.y, a: b.body.angle };
      // 너무 많이 돈 각도는 가까운 방향으로
      b.from.a = Math.atan2(Math.sin(b.from.a), Math.cos(b.from.a));
      b.delay = fromSky ? i * 35 : Math.abs(i - books.length / 2) * 18;
      b.body.collisionFilter.mask = 0;
    });
    engine.gravity.y = 0;
    tween = { start: now, dur: fromSky ? 900 : 750 };
  }

  function stepTween(now) {
    let done = true;
    books.forEach((b, i) => {
      let t = (now - tween.start - b.delay) / tween.dur;
      if (t < 1) done = false;
      t = Math.max(0, Math.min(1, t));
      const e = 1 - Math.pow(1 - t, 3);
      const h = homes[i];
      Body.setPosition(b.body, { x: b.from.x + (h.x - b.from.x) * e, y: b.from.y + (h.y - b.from.y) * e });
      Body.setAngle(b.body, b.from.a * (1 - e));
      Body.setVelocity(b.body, { x: 0, y: 0 });
      Body.setAngularVelocity(b.body, 0);
    });
    if (done) {
      books.forEach(b => (b.body.collisionFilter.mask = 0xFFFFFFFF));
      engine.gravity.y = 1.1;
      tween = null;
    }
  }

  function scatter() {
    if (tween) return;
    books.forEach(b => (b.target = 0));
    const dir = Math.random() < 0.5 ? 1 : -1;
    const order = dir > 0 ? books : [...books].reverse();
    // 한쪽 끝부터 차례로 기울어지는 도미노
    order.forEach((b, i) => {
      setTimeout(() => {
        if (Math.abs(Math.sin(b.body.angle)) < 0.5) {
          Body.setAngularVelocity(b.body, (0.05 + Math.random() * 0.04) * dir);
          Body.setVelocity(b.body, { x: 1.2 * dir, y: b.body.velocity.y });
        }
      }, i * 70);
    });
    // 몇 권은 튀어 올라 헝클어지게
    books.forEach(b => {
      if (Math.random() < 0.3) {
        setTimeout(() => {
          Body.setVelocity(b.body, { x: (Math.random() - .5) * 10, y: -7 - Math.random() * 9 });
          Body.setAngularVelocity(b.body, (Math.random() - .5) * 0.4);
        }, 500 + Math.random() * 1200);
      }
    });
  }
  document.getElementById('tidy').onclick = () => !tween && tidy(false);
  document.getElementById('scatter').onclick = scatter;

  /* ---------- 돌아가기(책등 → 표지) ---------- */
  // 몸체 폭을 바꿀 때는 각도를 0으로 돌려놓고 가로로만 늘린 뒤 다시 기울임
  function setBodyWidth(b, w) {
    const body = b.body, a = body.angle;
    Body.setAngle(body, 0);
    Body.scale(body, w / b.cw, 1);
    Body.setAngle(body, a);
    b.cw = w;
  }

  let pointerType = 'mouse';
  let hovered = null;
  function bodyAt(x, y) {
    const hits = Query.point(books.map(b => b.body), { x, y });
    return hits.length ? hits[hits.length - 1].book : null;
  }

  stage.addEventListener('pointermove', e => {
    pointerType = e.pointerType;
    if (pointerType !== 'mouse' || tween) return;
    hovered = bodyAt(e.clientX, e.clientY);
  });
  stage.addEventListener('pointerleave', () => { if (pointerType === 'mouse') hovered = null; });

  // 클릭/탭 판정 (끌기와 구분)
  let down = null;
  stage.addEventListener('pointerdown', e => {
    pointerType = e.pointerType;
    down = { x: e.clientX, y: e.clientY, t: performance.now(), book: bodyAt(e.clientX, e.clientY) };
  });
  stage.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    const b = down.book; down = null;
    if (!b || moved > 6) return;
    if (b.turn > 0.85 && b.pub) { openLink(b.url); return; }
    if (pointerType !== 'mouse') {
      // 터치: 첫 탭은 돌려서 표지 보기, 다른 책은 원래대로
      books.forEach(o => { if (o !== b) o.target = 0; });
      b.target = b.target ? 0 : 1;
    } else {
      b.target = 1;
    }
  });

  function openLink(url) {
    const a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------- 루프 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(32, now - last); last = now;
    if (tween) stepTween(now);

    // 마우스를 올린 책: 바로 서 있고 거의 멈춰 있을 때 돌아감
    if (pointerType === 'mouse') {
      books.forEach(b => {
        const dragging = mc.body === b.body;
        if (b === hovered) {
          const upright = Math.abs(Math.sin(b.body.angle)) < 0.25;
          if (upright || b.target === 1) b.target = 1;
        } else if (!dragging) {
          b.target = 0;
        }
      });
    }

    books.forEach(b => {
      const speed = b.target > b.turn ? 0.0032 : 0.0042;
      if (b.turn !== b.target) {
        b.turn += Math.sign(b.target - b.turn) * speed * dt;
        b.turn = Math.max(0, Math.min(1, b.turn));
      }
      const th = b.turn * Math.PI / 2;
      const ease = Math.sin(th) ** 2; // 부드럽게
      const ang = Math.asin(Math.sqrt(ease));
      const c = Math.cos(ang), s = Math.sin(ang);
      const w = Math.max(b.T, b.T * c + b.W * s);
      if (Math.abs(w - b.cw) > 0.3) setBodyWidth(b, w);
      b.ang = ang;
    });

    Engine.update(engine, dt);

    books.forEach(b => {
      const p = b.body.position, a = b.body.angle;
      const deg = b.ang * 180 / Math.PI;
      const c = Math.cos(b.ang), s = Math.sin(b.ang);
      const front = b.W / 2 * c + b.T / 2 * s;
      b.el.style.width = b.cw + 'px';
      b.el.style.transform = `translate(${p.x - b.cw / 2}px, ${p.y - b.H / 2}px) rotate(${a}rad)`;
      b.box.style.left = (b.cw - b.T) / 2 + 'px';
      b.box.style.transform = `translateZ(${-front}px) rotateY(${-deg}deg)`;
      b.spineF.style.setProperty('--shade', (s * 0.55).toFixed(3));
      b.coverF.style.setProperty('--shade', (c * 0.45).toFixed(3));
      b.el.classList.toggle('show', b.turn > 0.9 && Math.abs(Math.sin(a)) < 0.3);
      b.el.style.zIndex = b.turn > 0.01 ? 5 : 1;
    });

    requestAnimationFrame(frame);
  }

  let rt;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(init, 250); });
  init();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
